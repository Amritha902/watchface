<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="994" viewBox="0 0 1500 994"><defs><radialGradient id="bgglow" cx=".2" cy=".1" r=".9"><stop offset="0" stop-color="#1b1b24"/><stop offset="1" stop-color="#08080a"/></radialGradient></defs><rect width="1500" height="994" rx="40" fill="url(#bgglow)"/><text x="96" y="96" font-family="Inter" font-weight="600" font-size="19" letter-spacing="3" fill="#9d9da8">SUBMISSION 10 · OPEN INNOVATION · PRODUCTIVITY / FOCUS</text><text x="96" y="182" font-family="Inter" font-weight="800" font-size="84" letter-spacing="-3" fill="#ffffff">Deep Work</text><text x="96" y="236" font-family="Inter" font-weight="400" font-size="21" fill="#d2d2da">For the Open Innovation theme, Deep Work wraps the time in a focus ring that counts down your session while</text><text x="96" y="268" font-family="Inter" font-weight="400" font-size="21" fill="#d2d2da">notifications wait quietly ('4 alerts on hold'). When the session ends the ring turns green, the break timer starts</text><text x="96" y="300" font-family="Inter" font-weight="400" font-size="21" fill="#d2d2da">and the face suggests you stand up and stretch. Always-on keeps a thin grey ring and the remaining focus time.</text><g id="Deep Work / Active Display"><clipPath id="s0-frame"><rect x="96" y="346" width="368" height="448" rx="86"/></clipPath><g clip-path="url(#s0-frame)"><rect x="96" y="346" width="368" height="448" fill="#000"/><g transform="translate(96 346) scale(0.92929 0.92562)"><defs>
