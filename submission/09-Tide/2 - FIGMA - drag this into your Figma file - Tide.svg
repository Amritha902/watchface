<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1026" viewBox="0 0 1500 1026"><defs><radialGradient id="bgglow" cx=".2" cy=".1" r=".9"><stop offset="0" stop-color="#1b1b24"/><stop offset="1" stop-color="#08080a"/></radialGradient></defs><rect width="1500" height="1026" rx="40" fill="url(#bgglow)"/><text x="96" y="96" font-family="Inter" font-weight="600" font-size="19" letter-spacing="3" fill="#9d9da8">SUBMISSION 09 · OPEN INNOVATION · DEVICE / UTILITY</text><text x="96" y="182" font-family="Inter" font-weight="800" font-size="84" letter-spacing="-3" fill="#ffffff">Tide</text><text x="96" y="236" font-family="Inter" font-weight="400" font-size="21" fill="#d2d2da">For the Open Innovation theme, Tide shows your battery as water: the level falls through the day beneath a light</text><text x="96" y="268" font-family="Inter" font-weight="400" font-size="21" fill="#d2d2da">hairline clock, so you can judge remaining charge from across the room. At low tide the water turns warm red and the</text><text x="96" y="300" font-family="Inter" font-weight="400" font-size="21" fill="#d2d2da">face asks you to charge soon, with an estimate of hours left. Always-on keeps a single wave line at the current</text><text x="96" y="332" font-family="Inter" font-weight="400" font-size="21" fill="#d2d2da">level.</text><g id="Tide / Active Display"><clipPath id="s0-frame"><rect x="96" y="378" width="368" height="448" rx="86"/></clipPath><g clip-path="url(#s0-frame)"><rect x="96" y="378" width="368" height="448" fill="#000"/><g transform="translate(96 378) scale(0.92929 0.92562)"><defs>
