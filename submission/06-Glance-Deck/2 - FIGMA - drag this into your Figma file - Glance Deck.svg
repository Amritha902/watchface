<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1026" viewBox="0 0 1500 1026"><defs><radialGradient id="bgglow" cx=".2" cy=".1" r=".9"><stop offset="0" stop-color="#1b1b24"/><stop offset="1" stop-color="#08080a"/></radialGradient></defs><rect width="1500" height="1026" rx="40" fill="url(#bgglow)"/><text x="96" y="96" font-family="Inter" font-weight="600" font-size="19" letter-spacing="3" fill="#9d9da8">SUBMISSION 06 · OPEN INNOVATION · PRODUCTIVITY / NOTIFICATIONS</text><text x="96" y="182" font-family="Inter" font-weight="800" font-size="84" letter-spacing="-3" fill="#ffffff">Glance Deck</text><text x="96" y="236" font-family="Inter" font-weight="400" font-size="21" fill="#d2d2da">For the Open Innovation theme, Glance Deck turns the watch face into a tiny notification centre: your next three</text><text x="96" y="268" font-family="Inter" font-weight="400" font-size="21" fill="#d2d2da">things sit in a fanned stack of glass cards under a large clock, with the most urgent card (a delivery arriving in 6</text><text x="96" y="300" font-family="Inter" font-weight="400" font-size="21" fill="#d2d2da">minutes) at the front. Tap to spread the deck into a readable list and swipe to clear; weather, steps and music live</text><text x="96" y="332" font-family="Inter" font-weight="400" font-size="21" fill="#d2d2da">as three glass tiles below. Always-on shows only the time and a '3 waiting' badge.</text><g id="Glance Deck / Active Display"><clipPath id="s0-frame"><rect x="96" y="378" width="368" height="448" rx="86"/></clipPath><g clip-path="url(#s0-frame)"><rect x="96" y="378" width="368" height="448" fill="#000"/><g transform="translate(96 378) scale(0.92929 0.92562)"><defs>
